name: CI

# This repository had no workflows at all until this file: zero runs in its entire history, so
# every one of its merges was gated only by somebody running batteries by hand.
#
# READ THIS BEFORE TRUSTING A GREEN CHECK. The two halves of this repository are not equally
# covered, and the asymmetry is structural rather than an oversight:
#
#   TypeScript/CLI/MCP/server — built, typechecked and tested here on Linux, minus the suites
#     listed in .github/linux-quarantine.txt, which cannot pass on this platform for environmental
#     reasons. The `typescript` job proves afterwards that it ran exactly the gated set.
#   Swift/native (87 files under src/native) — needs a macOS toolchain. The `native` job covers it.
#     If that job is ever removed or made non-blocking, the `scope` job goes red, because a green
#     run that silently skipped the native half is the exact false-assurance this file exists to
#     end.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The suite is long and macOS minutes are not free in every billing configuration, so a superseded
# push should stop paying for itself. Only for pull requests: a run on `main` is the record of what
# that commit did and must not be cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript (Linux — native/Swift NOT covered here)
    runs-on: ubuntu-24.04
    # Generous on purpose. Hundreds of tests in this suite spawn subprocesses, and the honest
    # measurement to tighten this against is the wall time of the run below, not an estimate.
    timeout-minutes: 45
    env:
      # Raised well above bun's 5000ms default because a subprocess-spawning test that trips the
      # default reports as `Received: ""` — a message that reads like a logic bug and has cost this
      # repository real time. Note that tests carrying their own hardcoded budget (the FIFO waits in
      # macos-app-lifecycle) cannot be rescued by this value; they are quarantined instead.
      RECORDINGS_TEST_TIMEOUT_MS: "120000"
      JUNIT_REPORT: gated-junit.xml
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned, not `latest`. bun.lock was written by 1.3.14 and the lockfile format is the
          # thing --frozen-lockfile is checking against.
          bun-version: 1.3.14

      - name: Install locked dependencies
        # --frozen-lockfile is not hygiene here, it is the fix for a recorded incident: every
        # dependency is a caret range, and a plain `bun install` resolves @hasna/events to 0.1.14,
        # which dropped a shipped CLI command inside the patch range and manufactured a cli.test.ts
        # regression that cost a session to chase.
        run: bun install --frozen-lockfile

      - name: The lockfile is unchanged by installing it
        # The check --frozen-lockfile cannot perform on itself. If the flag is ever dropped, or a
        # range is widened without relocking, the drift shows up here as a diff rather than as a
        # mystery test failure three jobs later.
        run: git diff --exit-code -- bun.lock

      - name: Record resolved dependency versions
        # Evidence, not a gate. Every past argument about a cross-tree comparison in this repo
        # turned on which version of a dependency was actually resolved, and nobody could answer it
        # after the fact.
        run: |
          {
            echo '### Resolved dependencies'
            echo
            echo '```'
            bun pm ls 2>&1 | sed 's/^/  /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check
        run: bun run typecheck

      - name: Type check the TCC contract project
        run: bun run typecheck:tcc-contract

      - name: Type check the shortcut contract project
        run: bun run typecheck:shortcut-contract

      - name: Validate the Linux quarantine
        # Fails when an entry names a suite that no longer exists, when a test file is untracked and
        # therefore invisible to the gate, or when git and a filesystem walk disagree about what the
        # suite even is. Any of those silently shrinks the gate.
        run: bun run verify:ci-suite

      - name: Test the gated suite
        # pipefail is load-bearing: without it the pipeline reports tee's status and every test
        # failure merges green. `2>&1` is equally load-bearing — bun writes its results and its
        # summary to stderr, so a stdout-only capture records nothing at all.
        shell: bash
        run: |
          set -o pipefail
          bun test \
            --timeout "$RECORDINGS_TEST_TIMEOUT_MS" \
            --reporter=junit --reporter-outfile="$JUNIT_REPORT" \
            $(bun scripts/ci-linux-suite.ts --gated) 2>&1 | tee gated-console.log

      - name: The gated run covered exactly the gated set
        # `bun test` matches positional arguments as SUBSTRING FILTERS, not as paths, so handing it
        # a list is not evidence that it ran that list. This reads back the runner's own JUnit
        # report and requires the executed set to equal the gated set — no quarantined suite pulled
        # in, no gated suite silently unmatched. Without it the whole partition is unverified.
        if: always()
        run: bun run verify:ci-suite:run -- "$JUNIT_REPORT"

      - name: Quarantined suites are still failing
        # The quarantine's expiry date. Each entry is re-run and required to STILL fail: when the
        # environmental cause is fixed the suite goes green, this step goes red, and it tells you to
        # delete the line. Without this a quarantine is permanent by default and nobody revisits it.
        #
        # Run one file per invocation. Several of these scan a shared /tmp, and concurrent suites
        # corrupt each other's fixtures, which is how a quarantined suite could appear to pass.
        if: always()
        shell: bash
        run: |
          stale=0
          for suite in $(bun scripts/ci-linux-suite.ts --quarantined); do
            if bun test --timeout "$RECORDINGS_TEST_TIMEOUT_MS" "$suite" > "quarantine.log" 2>&1; then
              echo "::error title=Stale quarantine::$suite now passes on Linux. Delete its line from .github/linux-quarantine.txt so the gate covers it."
              stale=1
            else
              echo "::warning title=NOT covered by the Linux gate::$suite is quarantined and still failing on Linux, as recorded. Its behaviour is unverified by this run."
            fi
            tail -20 "quarantine.log"
          done
          exit "$stale"

      - name: Build
        run: bun run build

      - name: Release guard over package-visible files
        # The secret-pattern and retired-cloud scan that `prepack` runs. Cheap, and it is the only
        # automated check in the repo that looks at what would actually ship.
        run: bun run verify:release

      - name: Generated SDK is in sync with the contract
        # WARN-ONLY, deliberately, and this is not laziness. On main at 32c5538 regenerating already
        # produces a diff: the committed header says "Recordings V1 API 0.2.13" against a
        # package version of 0.2.15. It is a stale version stamp in a comment with no API-surface
        # drift, and the version triple is owned by an open version-writer PR (#37), so gating on it
        # would make this workflow red on arrival for a defect it does not own and cannot fix.
        # Promote to a hard failure once that lands.
        if: always()
        shell: bash
        run: |
          bun run generate:sdk > /dev/null
          if git diff --quiet -- src/sdk; then
            echo "generated SDK matches the contract"
          else
            echo "::warning title=Generated SDK is stale (NOT gated)::bun run generate:sdk produces a diff on this commit. Pre-existing on main; see the diff below."
            git --no-pager diff -- src/sdk
          fi
          git checkout -- src/sdk

      - name: Diff hygiene
        run: git diff --check

      - name: Preserve the test report
        # The JUnit report carries a per-test duration, which is the only measured basis for
        # tightening RECORDINGS_TEST_TIMEOUT_MS and timeout-minutes above.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gated-test-report-${{ github.sha }}
          path: |
            gated-junit.xml
            gated-console.log
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native (macOS — Swift build)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Record the toolchain
        # Printed before anything is built, because the failure this repository will actually hit is
        # a runner image whose Swift predates the 6.2 the package demands, and that surfaces as a
        # confusing parse error in Package.swift rather than as a version complaint.
        run: |
          {
            echo '### macOS runner toolchain'
            echo
            echo '```'
            sw_vers
            swift --version 2>&1
            xcodebuild -version 2>&1 || true
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The runner satisfies the toolchain the package declares
        # Derived from Package.swift rather than hardcoded, so bumping swift-tools-version cannot
        # leave this check silently asserting an older floor than the package requires.
        shell: bash
        run: |
          required="$(sed -n 's|^// *swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' src/native/Recordings/Package.swift | head -1)"
          [ -n "$required" ] || { echo "::error::Could not read swift-tools-version from Package.swift"; exit 1; }
          actual="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          [ -n "$actual" ] || { echo "::error::Could not read a Swift version from this runner"; exit 1; }
          echo "package requires swift-tools-version $required; runner has Swift $actual"
          # Sort-based comparison: the lower of the two must be the requirement.
          lowest="$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)"
          if [ "$lowest" != "$required" ]; then
            echo "::error title=Swift toolchain too old::Runner Swift $actual cannot build a package requiring $required. The native half is NOT verified by this run."
            exit 1
          fi

      - name: Build every native target
        # The whole point of this job. Three open PRs have been holding 300+ uncompiled Swift lines
        # reviewed "by shape and call-site analysis only" because nothing could compile them.
        run: swift build --package-path src/native/Recordings

      - name: Compile the native test targets
        # --build-tests compiles the test code without running it. Separated from `swift test`
        # because a test that cannot COMPILE is a defect in the change under review, whereas a test
        # that cannot RUN on a headless runner is a property of the runner; conflating them means
        # neither is trustworthy.
        run: swift build --build-tests --package-path src/native/Recordings

      - name: The Swift dependency pins are unchanged by resolving them
        # Package.resolved is committed and both dependencies are exact/revision pinned. A diff here
        # means the build silently moved off a pin.
        run: git diff --exit-code -- src/native/Recordings/Package.resolved

      - name: Run the native test suites
        # NOT a gate yet, and the reason is stated rather than implied: these targets touch the
        # microphone, the clipboard and accessibility APIs, all of which are TCC-gated and have no
        # grantable state on a headless runner. Whether that makes them unrunnable or merely partly
        # unrunnable has never been measured, so this step records the outcome instead of asserting
        # one. Promote to a gate, or quarantine per-suite the way Linux does, once measured.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if swift test --package-path src/native/Recordings 2>&1 | tee swift-test.log; then
            echo "::notice title=Native tests passed::swift test is green on this runner and can become a gate."
          else
            echo "::warning title=Native tests NOT gated::swift test did not pass on a headless runner. The native targets COMPILE (gated above) but their behaviour is unverified. See swift-test.log."
          fi

      - name: Build the native filesystem guard addon
        # scripts/build_native_fs_guard.sh exits 1 on any non-Darwin host, so this line has never
        # been executed by any automation. It is what `prepack` runs before a publish.
        run: |
          bun install --frozen-lockfile
          bun run build:native-fs-guard

      - name: Preserve native build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-logs-${{ github.sha }}
          path: swift-test.log
          if-no-files-found: ignore
          retention-days: 14

  scope:
    name: Coverage scope (what this run did and did not verify)
    needs: [typescript, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: State the coverage scope
        # This job exists so that no configuration of this workflow can produce an all-green run
        # while a half of the repository went unverified. It reads the other jobs' RESULTS, not
        # their logs, and it fails when either half did not actually run — a skipped or cancelled
        # job is otherwise rendered as a neutral grey tick that reviewers read as "fine".
        shell: bash
        env:
          TS_RESULT: ${{ needs.typescript.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          {
            echo '## Coverage scope for this run'
            echo
            echo "| Half of the repository | Job | Result |"
            echo "| --- | --- | --- |"
            echo "| TypeScript / CLI / MCP / server | \`typescript\` (Linux) | \`$TS_RESULT\` |"
            echo "| Swift / native (src/native) | \`native\` (macOS) | \`$NATIVE_RESULT\` |"
            echo
            echo 'Verified by this workflow: typecheck (3 projects), the gated bun suite proven to be'
            echo 'exactly the gated set, build, release guard, Swift compilation of every target and'
            echo 'every native test target, the Swift dependency pins, and the Darwin-only native'
            echo 'filesystem guard addon.'
            echo
            echo 'NOT verified by this workflow: the suites in `.github/linux-quarantine.txt`, the'
            echo 'RUNTIME behaviour of the Swift test targets (TCC-gated; compiled but not asserted),'
            echo 'code signing and notarization, and the vacuity mutation battery.'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if [ "$NATIVE_RESULT" != "success" ]; then
            echo "::error title=Native half unverified::The macOS job result is '$NATIVE_RESULT'. No Swift code in this change has been compiled by CI. Do not read the other checks as covering src/native."
            fail=1
          fi
          if [ "$TS_RESULT" != "success" ]; then
            echo "::error title=TypeScript half unverified::The Linux job result is '$TS_RESULT'."
            fail=1
          fi
          exit "$fail"
